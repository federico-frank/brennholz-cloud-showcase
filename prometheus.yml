global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # 8080 = Standardstart, 8081 = zweite Instanz (z. B. parallel zum Testen); ein nicht laufendes Ziel ist nur „down“
      - targets: ['host.docker.internal:8080', 'host.docker.internal:8081']
