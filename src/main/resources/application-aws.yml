# Profil für den Betrieb in AWS (F-043 S8). Alle Werte kommen aus der Umgebung (.env auf der EC2, gefüllt aus SSM).
spring:
  jpa:
    show-sql: false
    # schema.sql (aktiviert PostGIS) vor Hibernate ausführen – sonst scheitert auf leerer DB
    # "create table city_references (... geography ...)" beim ersten Start
    defer-datasource-initialization: false

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}

# In der Cloud liegen die Bilder in S3; Zugangsdaten kommen aus der IAM-Rolle bzw. der Umgebung
storage:
  type: s3

aws:
  s3:
    endpoint: https://s3.${AWS_REGION}.amazonaws.com
    region: ${AWS_REGION}
    bucket-name: ${S3_BUCKET_NAME}
    # AES-Verschlüsselung (SSE-S3 oder SSE-KMS) wird typischerweise direkt am Bucket in Terraform konfiguriert,
    # kann aber vom AWS SDK bei jedem Upload implizit erzwungen werden.

# Pflicht in der Cloud: ohne gesetztes Passwort startet die App nicht (F-053 S3)
admin:
  email: ${ADMIN_EMAIL}
  initial-password: ${ADMIN_INITIAL_PASSWORD}
