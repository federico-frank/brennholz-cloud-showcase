# Produktiver Stack auf der EC2 (Variante C). Werte kommen aus .env, die deploy.sh aus SSM schreibt.
# Öffentlich erreichbar ist nur Caddy (80/443); alles andere spricht nur im internen Docker-Netz.
name: brennholz

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    mem_limit: 1400m
    logging: *logging
    environment:
      SPRING_PROFILES_ACTIVE: aws
      DB_HOST: ${DB_HOST}
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: brennholz
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      GRAFANA_BASE_URL: https://${SITE_HOST}/grafana/d
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    mem_limit: 400m
    logging: *logging
    environment:
      RABBITMQ_DEFAULT_USER: brennholz
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    mem_limit: 400m
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=400d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    mem_limit: 300m
    logging: *logging
    environment:
      GF_SERVER_ROOT_URL: https://${SITE_HOST}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true" # nur Lesen, für das eingebettete Dashboard (Q11)
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards-json:/var/lib/grafana/dashboards:ro

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    mem_limit: 100m
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST}
      REDIRECT_HOSTS: ${REDIRECT_HOSTS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - grafana

volumes:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  caddy-data: # Let's-Encrypt-Zertifikate überleben Neustarts
  caddy-config:
